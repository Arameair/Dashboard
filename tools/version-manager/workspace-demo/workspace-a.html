<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instance A mock</title><style>body{font:15px system-ui;background:#123047;color:white;padding:12px}button,input{font:inherit;margin:5px;padding:7px}output{display:block;margin:12px 0}button:focus-visible{outline:3px solid gold}</style><h2>Workspace A • Telemetry Alpha</h2><label>Experiment name <input id="name" value="alpha-A-draft"></label><div><button id="increment">Process one event</button><button id="pause">Pause auto</button><button id="disconnect">Disconnect A</button></div><output id="count">Processed: 0</output><script>const id='telemetry-alpha-a';let n=0,paused=false,disconnected=false;const emit=msg=>parent.postMessage({kind:'synthetic-workspace-event',id,message:new Date().toISOString()+' A '+msg},'*');document.querySelector('#increment').onclick=()=>{if(disconnected)return emit('DISCONNECTED, action refused');document.querySelector('#count').textContent='Processed: '+(++n);emit('Processed '+n+' for '+document.querySelector('#name').value)};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume auto':'Pause auto';emit(paused?'WAITING':'RUNNING')};document.querySelector('#disconnect').onclick=()=>{disconnected=!disconnected;document.querySelector('#disconnect').textContent=disconnected?'Reconnect A':'Disconnect A';emit(disconnected?'DISCONNECTED':'RUNNING')};setInterval(()=>{if(!paused&&!disconnected)emit('RUNNING heartbeat '+(++n))},1800);emit('RUNNING ready (SIMULATED)')</script></html>
