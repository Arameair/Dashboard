<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instance B mock</title><style>body{font:15px system-ui;background:#2b2043;color:white;padding:12px}button,input{font:inherit;margin:5px;padding:7px}output{display:block;margin:12px 0}button:focus-visible{outline:3px solid gold}</style><h2>Workspace B • Telemetry Beta</h2><label>Test annotation <input id="note" value="beta-B-input"></label><div><button id="increment">Capture sample</button><button id="pause">Pause B</button><button id="disconnect">Disconnect B</button></div><output id="count">Samples: 0</output><script>const id='telemetry-alpha-b';let n=0,paused=false,disconnected=false;const emit=msg=>parent.postMessage({kind:'synthetic-workspace-event',id,message:new Date().toISOString()+' B '+msg},'*');document.querySelector('#increment').onclick=()=>{if(disconnected)return emit('DISCONNECTED, capture refused');document.querySelector('#count').textContent='Samples: '+(++n);emit('Captured '+n+' '+document.querySelector('#note').value)};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume B':'Pause B';emit(paused?'WAITING':'RUNNING')};document.querySelector('#disconnect').onclick=()=>{disconnected=!disconnected;document.querySelector('#disconnect').textContent=disconnected?'Reconnect B':'Disconnect B';emit(disconnected?'DISCONNECTED':'RUNNING')};setInterval(()=>{if(!paused&&!disconnected)emit('RUNNING heartbeat '+(++n))},2100);emit('RUNNING ready (SIMULATED)')</script></html>
