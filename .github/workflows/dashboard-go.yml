name: Go dashboard checks
on:
  push:
    branches:
      - main
      - improve/dashboard-reliability
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
      - name: Windows cross-compile
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/Dashboard.exe ./source
      - name: Unit tests
        run: go test -race ./source
      - name: Vet
        run: go vet ./source
